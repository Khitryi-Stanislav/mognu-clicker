<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#120b2b">
  <meta name="description" content="Кликни на тиктокершу и поймай ритм 6-7. Абсурдный кликер про мем 2026 года.">
  <meta name="keywords" content="могну, кликер, мем, тикток, игра">
  <meta property="og:title" content="Я тебя МОГНУ">
  <meta property="og:description" content="Абсурдный кликер про мем 2026 года с тиктокершами">
  <meta property="og:image" content="assets/preview.png">
  <title>Я тебя МОГНУ</title>
  <style>
    :root { 
      --pink:#ff3d9a; 
      --violet:#7d4dff; 
      --ink:#160d30;
      --bg-light: radial-gradient(circle at 50% 20%,#4a267d 0,#180c38 48%,#090619 100%);
      --bg-dark: #0a0a1a;
      --text-light: #fff;
      --text-dark: #1a1a2e;
      --card-light: rgba(255,255,255,.08);
      --card-dark: rgba(20,20,40,.7);
      --border-light: rgba(255,255,255,.13);
      --border-dark: rgba(255,61,154,.2);
    }
    
    * { box-sizing:border-box; }
    
    body { 
      margin:0; 
      min-height:100vh; 
      overflow-x:hidden; 
      color:var(--text-light); 
      font-family:Arial,sans-serif; 
      background:var(--bg-light);
      transition: background .3s, color .3s;
    }
    
    body.dark-theme {
      background: var(--bg-dark);
      color: var(--text-dark);
    }
    
    body::before { 
      content:'6 7'; 
      position:fixed; 
      inset:-10vh -5vw; 
      display:grid; 
      place-items:center; 
      color:rgba(255,255,255,.035); 
      font-size:clamp(180px,42vw,620px); 
      font-weight:900; 
      letter-spacing:-.12em; 
      transform:rotate(-12deg); 
      pointer-events:none; 
    }
    
    body.dark-theme::before {
      color: rgba(255,255,255,.08);
    }
    
    .app { 
      position:relative; 
      width:min(100%,620px); 
      min-height:100vh; 
      margin:auto; 
      padding:18px 16px 28px; 
    }
    
    header { 
      text-align:center; 
      margin-bottom: 12px;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    h1 { 
      margin:0; 
      font-size:clamp(28px,7vw,44px); 
      letter-spacing:.02em; 
      text-shadow:0 0 24px rgba(255,61,154,.65);
    }
    
    body.dark-theme h1 {
      text-shadow: 0 0 16px rgba(255,61,154,.4);
      color: #fff;
    }
    
    .subtitle { 
      opacity:.75; 
      font-size:13px;
    }
    
    .theme-toggle {
      font-size:24px;
      cursor:pointer;
      transition: transform .2s;
      background: none;
      border: none;
      padding: 0;
    }
    
    .theme-toggle:hover {
      transform: scale(1.15);
    }
    
    .stats { 
      display:flex; 
      gap:10px; 
      justify-content:center; 
      margin:18px 0 8px; 
      flex-wrap:wrap;
    }
    
    .stat { 
      min-width:105px; 
      padding:10px 14px; 
      border:1px solid var(--border-light); 
      border-radius:16px; 
      background:var(--card-light); 
      text-align:center; 
      backdrop-filter:blur(10px);
    }
    
    body.dark-theme .stat {
      background: var(--card-dark);
      border-color: var(--border-dark);
    }
    
    .stat small { 
      display:block; 
      opacity:.7; 
      font-size:10px; 
      text-transform:uppercase; 
      letter-spacing:.08em; 
    }
    
    .stat strong { 
      font-size:22px; 
    }
    
    .hero { 
      position:relative; 
      min-height:405px; 
      display:grid; 
      place-items:center; 
      cursor:pointer; 
      touch-action:manipulation; 
      user-select:none; 
    }
    
    .hero::before { 
      content:'6–7'; 
      position:absolute; 
      z-index:-1; 
      font-size:clamp(170px,48vw,300px); 
      font-weight:900; 
      color:rgba(255,255,255,.07); 
      letter-spacing:-.15em; 
      transform:rotate(-8deg);
    }
    
    body.dark-theme .hero::before {
      color: rgba(255,255,255,.12);
    }
    
    .character { 
      width:min(78vw,250px); 
      height:340px; 
      object-fit:contain; 
      filter:drop-shadow(0 15px 24px rgba(0,0,0,.5)); 
      transition:transform .08s;
    }
    
    .hero.pressed .character { 
      transform:scale(.96) rotate(-1deg); 
    }
    
    .hint { 
      margin-top:-14px; 
      font-weight:700; 
      color:#ffd3ed; 
      text-shadow:0 0 12px var(--pink);
    }
    
    body.dark-theme .hint {
      color: #ff69b4;
    }
    
    #particles { 
      position:fixed; 
      inset:0; 
      pointer-events:none; 
      overflow:hidden; 
    }
    
    .particle { 
      position:absolute; 
      font-weight:900; 
      color:#ffd3ed; 
      animation:fly .75s ease-out forwards; 
      text-shadow:0 0 10px var(--pink);
    }
    
    @keyframes fly { 
      to { 
        opacity:0; 
        transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.35); 
      } 
    }
    
    .progress-wrap { 
      margin:4px 0 18px; 
    }
    
    .progress-label { 
      display:flex; 
      justify-content:space-between; 
      font-size:12px; 
      opacity:.8; 
      margin-bottom:6px; 
    }
    
    .progress { 
      height:10px; 
      border-radius:99px; 
      background:rgba(255,255,255,.13); 
      overflow:hidden;
    }
    
    body.dark-theme .progress {
      background: rgba(255,255,255,.2);
    }
    
    .progress i { 
      display:block; 
      height:100%; 
      width:0; 
      border-radius:inherit; 
      background:linear-gradient(90deg,var(--violet),var(--pink)); 
      transition:width .25s; 
    }
    
    .upgrades { 
      padding:15px; 
      border-radius:20px; 
      background:var(--card-light); 
      border:1px solid var(--border-light); 
      margin-bottom:12px;
    }
    
    body.dark-theme .upgrades {
      background: var(--card-dark);
      border-color: var(--border-dark);
    }
    
    .upgrades h2 { 
      margin:0 0 12px; 
      font-size:18px; 
    }
    
    .upgrade-list { 
      display:grid; 
      grid-template-columns:1fr 1fr; 
      gap:9px; 
    }
    
    .upgrade-item { 
      border:1px solid rgba(255,255,255,.18); 
      background:rgba(16,9,39,.6); 
      color:#fff; 
      border-radius:13px; 
      padding:11px; 
      text-align:left; 
      cursor:pointer; 
      transition:all .2s;
    }
    
    body.dark-theme .upgrade-item {
      background: rgba(255,255,255,.05);
      border-color: rgba(255,61,154,.3);
      color: #fff;
    }
    
    .upgrade-item:hover:not(:disabled) { 
      border-color:var(--pink); 
      background:rgba(255,61,154,.15);
    }
    
    .upgrade-item:disabled { 
      opacity:.4; 
      cursor:not-allowed; 
    }
    
    .upgrade-name { 
      font-weight:700; 
      font-size:13px; 
    }
    
    .upgrade-desc { 
      min-height:29px; 
      margin:4px 0; 
      opacity:.68; 
      font-size:11px; 
    }
    
    .upgrade-cost { 
      color:#ffd0eb; 
      font-size:12px;
    }
    
    body.dark-theme .upgrade-cost {
      color: #ff69b4;
    }
    
    .achievements-section { 
      padding:15px; 
      border-radius:20px; 
      background:var(--card-light); 
      border:1px solid var(--border-light); 
      margin-bottom:12px;
    }
    
    body.dark-theme .achievements-section {
      background: var(--card-dark);
      border-color: var(--border-dark);
    }
    
    .achievements-section h3 { 
      margin:0 0 12px; 
      font-size:16px; 
    }
    
    .achievement-list { 
      display:grid; 
      grid-template-columns:repeat(4,1fr); 
      gap:8px; 
    }
    
    .achievement { 
      width:60px; 
      height:60px; 
      border-radius:10px; 
      background:rgba(255,255,255,.1); 
      border:1px solid rgba(255,255,255,.2); 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      font-size:24px; 
      cursor:help; 
      transition:all .2s;
    }
    
    body.dark-theme .achievement {
      background: rgba(255,255,255,.05);
      border-color: rgba(255,61,154,.2);
    }
    
    .achievement.unlocked { 
      background:rgba(255,61,154,.25); 
      border-color:var(--pink);
    }
    
    body.dark-theme .achievement.unlocked {
      background: rgba(255,61,154,.35);
      border-color: var(--pink);
    }
    
    .achievement:hover { 
      transform:scale(1.08);
    }
    
    .footer { 
      text-align:center; 
      font-size:11px; 
      opacity:.5;
    }
    
    .btn-group { 
      display:flex; 
      gap:8px; 
      justify-content:center; 
      margin-bottom:12px;
    }
    
    .btn { 
      padding:8px 14px; 
      border:1px solid rgba(255,255,255,.2); 
      background:rgba(255,255,255,.08); 
      color:#fff; 
      border-radius:8px; 
      font-size:11px; 
      cursor:pointer; 
      transition:all .2s;
    }
    
    body.dark-theme .btn {
      background: rgba(255,255,255,.05);
      border-color: rgba(255,61,154,.3);
      color: #fff;
    }
    
    .btn:hover { 
      background:rgba(255,61,154,.2); 
      border-color:var(--pink);
    }
    
    @media(max-width:430px){ 
      .hero{min-height:350px}
      .character{height:290px}
      .upgrade-list{grid-template-columns:1fr}
      .achievement-list{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="header-top">
        <h1>Я тебя МОГНУ</h1>
        <button class="theme-toggle" id="theme-toggle" title="Переключить тему">🌙</button>
      </div>
      <div class="subtitle">кликни по персонажу — поймай ритм</div>
    </header>
    <section class="stats">
      <div class="stat">
        <small>могнов</small>
        <strong id="money">0</strong>
      </div>
      <div class="stat">
        <small>уровень</small>
        <strong id="level">1</strong>
      </div>
      <div class="stat">
        <small>в секунду</small>
        <strong id="per-second">0</strong>
      </div>
      <div class="stat">
        <small>достижения</small>
        <strong id="achievement-count">0/10</strong>
      </div>
    </section>
    <section class="hero" id="hero" aria-label="Кликнуть по персонажу">
      <img class="character" id="character" alt="Персонаж уровня 1">
      <div class="hint" id="character-name">МОГНУ!</div>
    </section>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">До следующего уровня</span>
        <span id="clicks">0 / 100</span>
      </div>
      <div class="progress"><i id="progress-bar"></i></div>
    </div>
    <div class="btn-group">
      <button class="btn" id="ad-btn">📺 x2 Доход на 30с</button>
      <button class="btn" id="daily-btn">🎁 Дневной бонус</button>
      <button class="btn" id="share-btn">📤 Поделиться</button>
    </div>
    <section class="upgrades">
      <h2>⬆️ Улучшения</h2>
      <div class="upgrade-list" id="upgrades-container"></div>
    </section>
    <section class="achievements-section">
      <h3>🏆 Достижения</h3>
      <div class="achievement-list" id="achievements-container"></div>
    </section>
    <div class="footer">Прогресс автосохраняется • Музыка включается при клике</div>
  </main>
  <div id="particles"></div>
  <audio id="music" loop preload="auto" src="assets/ya-tebya-mognu.mp3"></audio>
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <script src="game.js"></script>
</body>
</html>

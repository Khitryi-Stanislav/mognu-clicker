<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я тебя МОГНУ - Кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .game-board {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .level-info {
            font-size: 18px;
            color: #666;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 120px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .character-section {
            margin-bottom: 30px;
        }

        .character {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            user-select: none;
        }

        .character:hover {
            transform: scale(1.05);
        }

        .character:active {
            transform: scale(0.95);
        }

        .character-name {
            font-size: 18px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .click-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .click-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .click-button:active {
            transform: translateY(0);
        }

        .upgrades {
            margin-bottom: 20px;
        }

        .upgrades-title {
            font-size: 18px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .upgrade-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .upgrade-item {
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .upgrade-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-item.disabled:hover {
            border-color: #ddd;
            background: #f5f5f5;
            transform: none;
        }

        .upgrade-name {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .upgrade-cost {
            font-size: 12px;
            color: #666;
        }

        .upgrade-level {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .floating-text {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            font-size: 24px;
            color: #764ba2;
            animation: float-up 1s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.2);
            }
        }

        @media (max-width: 600px) {
            .game-board {
                padding: 20px;
            }

            .title {
                font-size: 24px;
            }

            .character {
                width: 120px;
                height: 120px;
                font-size: 48px;
            }

            .click-button {
                padding: 15px 30px;
                font-size: 18px;
            }

            .upgrade-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-board">
            <div class="header">
                <div class="title">🎯 Я тебя МОГНУ</div>
                <div class="level-info">Уровень <span id="level">1</span></div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">МОГНОВ</div>
                    <div class="stat-value" id="money">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">В СЕК</div>
                    <div class="stat-value" id="per-second">0</div>
                </div>
            </div>

            <div class="character-section">
                <div class="character-name" id="character-name">Новичок-Могн</div>
                <div class="character" id="character">😊</div>
                <button class="click-button" id="click-btn">МОГНУ!</button>
            </div>

            <div class="upgrades">
                <div class="upgrades-title">⬆️ Улучшения</div>
                <div class="upgrade-list" id="upgrades-container"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
